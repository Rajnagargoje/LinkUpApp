<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="linkupGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <radialGradient id="linkupHalo" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- soft ambient glow -->
  <circle cx="200" cy="185" r="180" fill="url(#linkupHalo)" />

  <!-- floating accent dots: random / lively feel -->
  <circle cx="348" cy="74" r="9" fill="#2dd4a7" opacity="0.85" />
  <circle cx="52" cy="238" r="12" fill="#f5a962" opacity="0.8" />
  <circle cx="326" cy="298" r="7" fill="#f0596e" opacity="0.75" />
  <circle cx="70" cy="86" r="6" fill="#764ba2" opacity="0.55" />

  <!-- dashed connector suggesting a match being made -->
  <path
    d="M 205 150 Q 250 175 250 220"
    fill="none"
    stroke="#c2c9fb"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="1 10"
  />

  <!-- BUBBLE A — sender, brand gradient, with typing indicator -->
  <path
    d="M 178 205 Q 186 224 210 232 Q 190 226 176 212 Z"
    fill="url(#linkupGrad)"
  />
  <rect x="42" y="70" width="196" height="128" rx="32" fill="url(#linkupGrad)" />
  <circle cx="103" cy="134" r="8" fill="#ffffff" opacity="0.95" />
  <circle cx="140" cy="134" r="8" fill="#ffffff" opacity="0.75" />
  <circle cx="177" cy="134" r="8" fill="#ffffff" opacity="0.55" />

  <!-- BUBBLE B — reply, light surface, with a spark (instant connection) -->
  <path
    d="M 222 236 Q 214 255 190 262 Q 210 256 224 243 Z"
    fill="#ffffff"
    stroke="#e8e3ff"
    stroke-width="2"
  />
  <rect
    x="172" y="222" width="182" height="112" rx="28"
    fill="#ffffff" stroke="#e8e3ff" stroke-width="2"
  />
  <path
    d="M 218 250 L 202 282 L 218 282 L 210 308 L 240 272 L 222 272 Z"
    fill="#f0596e"
  />
  <rect x="252" y="258" width="66" height="9" rx="4.5" fill="#e8e3ff" />
  <rect x="252" y="276" width="46" height="9" rx="4.5" fill="#e8e3ff" />
</svg>
